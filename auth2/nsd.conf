# auth2 – "sekundarni" server sa STAROM kopijom zone (greška F1).
# Kao da prenos zone (AXFR/IXFR) sa auth1 ne radi već mesec dana:
# serial je stari, a potpisi su istekli. Zonu pravi scripts/break.sh.
server:
    ip-address: 0.0.0.0
    zonesdir: "/etc/nsd"
    verbosity: 2

zone:
    name: "f1-stale-secondary.test."
    zonefile: "f1-stale-secondary.test.zone.signed"
