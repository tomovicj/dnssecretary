# auth2 – "secondary" server with a STALE copy of the zone (error F1).
# As if zone transfer (AXFR/IXFR) from auth1 had been broken for a month:
# the serial is old and the signatures have expired. The zone is made by scripts/break.sh.
server:
    ip-address: 0.0.0.0
    zonesdir: "/etc/nsd"
    verbosity: 2

zone:
    name: "f1-stale-secondary.test."
    zonefile: "f1-stale-secondary.test.zone.signed"
