server:
    interface: 0.0.0.0
    access-control: 10.53.0.0/24 allow
    do-ip6: no                       # mreža nema IPv6, inače čeka timeout-e
    root-hints: "/etc/unbound/root.hints"
    module-config: "iterator"        # faza 0: BEZ validacije
    local-zone: "test." nodefault
    qname-minimisation: yes
    verbosity: 2
    logfile: ""                      # log ide na stdout -> docker logs

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no