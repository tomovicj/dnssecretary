server:
    interface: 0.0.0.0
    access-control: 10.53.0.0/24 allow
    do-ip6: no                       # the network has no IPv6, otherwise it waits for timeouts
    root-hints: "/etc/unbound/root.hints"
    module-config: "validator iterator"
    trust-anchor-file: "/etc/unbound/root.key"
    local-zone: "test." nodefault
    qname-minimisation: yes
    verbosity: 2
    logfile: ""                      # log goes to stdout -> docker logs
    val-log-level: 2                 # the log says WHY validation failed
    ede: yes                         # returns Extended DNS Error codes to the client

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no