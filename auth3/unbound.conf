# auth3 – misconfigured authoritative server (error F2).
# NSD can't disable TCP, so here Unbound serves the zone as an auth-zone.
#   do-tcp: no        -> as if a firewall blocked TCP 53
#   max-udp-size: 512 -> larger answers arrive truncated (TC bit), and TCP doesn't work
server:
    interface: 0.0.0.0
    access-control: 10.53.0.0/24 allow
    do-ip6: no
    do-tcp: no
    max-udp-size: 512
    module-config: "iterator"
    local-zone: "test." nodefault    # otherwise Unbound itself answers NXDOMAIN for .test
    verbosity: 2
    logfile: ""

auth-zone:
    name: "f2-tcp-edns.test."
    zonefile: "/etc/unbound/f2-tcp-edns.test.zone.signed"
    for-downstream: yes
    for-upstream: no
