# auth3 – loše podešen autoritativni server (greška F2).
# NSD ne može da ugasi TCP, zato ovde zonu služi Unbound kao auth-zone.
#   do-tcp: no        -> kao da firewall blokira TCP 53
#   max-udp-size: 512 -> veći odgovori stižu odsečeni (TC bit), a TCP ne radi
server:
    interface: 0.0.0.0
    access-control: 10.53.0.0/24 allow
    do-ip6: no
    do-tcp: no
    max-udp-size: 512
    module-config: "iterator"
    local-zone: "test." nodefault    # inače Unbound sam odgovara NXDOMAIN za .test
    verbosity: 2
    logfile: ""

auth-zone:
    name: "f2-tcp-edns.test."
    zonefile: "/etc/unbound/f2-tcp-edns.test.zone.signed"
    for-downstream: yes
    for-upstream: no
