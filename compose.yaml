name: dnssecretary          # the compose project, whatever the clone's directory is called (scripts/fixenv/prod.sh)

networks:
  web: {}                   # only for the web app's published port (dnslab can't publish ports)
  dnslab:
    internal: true          # No network access
    ipam:
      config:
        - subnet: 10.53.0.0/24
          ip_range: 10.53.0.128/25    # dynamic addresses (app) never collide with the fixed ones

services:
  root:
    build: { context: ./image, target: lab }
    image: dnslab
    command: nsd -d -c /etc/nsd/nsd.conf
    volumes: ["./root:/etc/nsd:ro"]
    networks: { dnslab: { ipv4_address: 10.53.0.2 } }

  tld:
    image: dnslab
    command: nsd -d -c /etc/nsd/nsd.conf
    volumes: ["./tld:/etc/nsd:ro"]
    networks: { dnslab: { ipv4_address: 10.53.0.3 } }
    depends_on: [root]

  auth1:
    image: dnslab
    command: nsd -d -c /etc/nsd/nsd.conf
    volumes: ["./auth1:/etc/nsd:ro"]
    networks: { dnslab: { ipv4_address: 10.53.0.11 } }
    depends_on: [root]

  auth2:                    # F1: secondary with a stale zone
    image: dnslab
    command: nsd -d -c /etc/nsd/nsd.conf
    volumes: ["./auth2:/etc/nsd:ro"]
    networks: { dnslab: { ipv4_address: 10.53.0.12 } }
    depends_on: [root]

  auth3:                    # F2: no TCP, UDP answers up to 512 bytes
    image: dnslab
    command: unbound -d -c /etc/unbound/unbound.conf
    volumes: ["./auth3:/etc/unbound:ro"]
    networks: { dnslab: { ipv4_address: 10.53.0.13 } }
    depends_on: [root]

  resolver:
    image: dnslab
    command: unbound -d -c /etc/unbound/unbound.conf
    volumes: ["./resolver:/etc/unbound:ro"]
    networks: { dnslab: { ipv4_address: 10.53.0.53 } }

  client:
    image: dnslab
    command: sleep infinity
    volumes: ["./client:/lab:ro"]
    dns: [10.53.0.53]
    networks: { dnslab: { ipv4_address: 10.53.0.100 } }

  signer:
    image: dnslab
    profiles: ["tools"]
    network_mode: none
    volumes: ["./:/lab"]
    working_dir: /lab

  app:                      # DNSSECretary (Java), run on demand: sh scripts/dnssecretary.sh
    build: { context: ./image, target: app }
    image: dnslab-app
    profiles: ["app"]
    volumes: ["./:/lab"]    # needs to write auth1/, tld/, build/ when fixing
    working_dir: /lab       # relative paths in arguments work the same as on the host
    entrypoint: ["java", "-jar", "/lab/dnssecretary/target/dnssecretary.jar",
                 "--config", "/lab/dnssecretary/config/lab.yaml"]
    networks: [dnslab]

  web:                      # the web app (DNSSECretary serve) on http://localhost:8080: sh scripts/web.sh
    build: { context: ./image, target: web }
    image: dnslab-web
    profiles: ["web"]
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"   # files it writes stay the lab owner's (set by web.sh)
    group_add: ["${DOCKER_GID:-0}"]             # may use the Docker socket
    volumes:
      - ./:/lab
      - /var/run/docker.sock:/var/run/docker.sock   # sandbox, restarts, demo.sh – a DEMO only: this is root on the host
    working_dir: /lab
    environment:
      HOST_LAB_DIR: ${HOST_LAB_DIR:-}             # the lab's path on the host (Docker mounts host paths)
      HOME: /tmp
    command: ["java", "-jar", "/lab/dnssecretary/target/dnssecretary.jar",
              "--config", "/lab/dnssecretary/config/lab.yaml", "serve", "--port", "8080"]
    ports: ["127.0.0.1:8080:8080"]
    networks: [dnslab, web]

  tour:                     # records the demo video (Playwright, demo/tour.mjs): sh scripts/video.sh
    image: mcr.microsoft.com/playwright:v1.48.2-jammy
    profiles: ["demo"]
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    volumes: ["./demo:/demo"]
    working_dir: /demo
    environment:
      HOME: /tmp
      BASE_URL: http://web:8080
      PACE: ${PACE:-1}
    command: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && node tour.mjs"]
    networks: [web]         # reaches the web app by name; npm needs the internet once
