# DNSSECretary – configuration for the lab.
# Paths are as seen INSIDE the app container (the repo is mounted at /lab).
# A config for the real world has the same shape: IANA root servers and trust anchor,
# collect.zoneSource: axfr or none, fix.parent.mode: instructions.

dns:
  rootServers: [10.53.0.2]              # as in resolver/root.hints
  trustAnchor: /lab/resolver/root.key   # made by sign.sh (DS of the root KSK)
  resolver: 10.53.0.53                  # second opinion + cache view (E1, E3); never Docker DNS 127.0.0.11
  timeoutMs: 3000
  ednsBufferSize: 1232
  ipv6: false                           # the lab network has no IPv6

thresholds:
  signatureExpiryWarnDays: 7            # A6
  minRsaBits: 2048                      # C3

collect:
  zoneSource: file                      # file | axfr | none
  zoneFileDirs: [/lab/auth1, /lab/auth3]  # file name: <zone>.zone.signed, first match wins (F2 is on auth3)
  keyDir: /lab/keys                     # optional: public keys (.key) incl. old/ next/ k2/ alg8/ retired/ (B1 vs E2)
  samples: ["www A", "@ NS", "@ MX", "@ TXT"]   # queried at every NS; the catalogue probe is added for lab zones
  nodataType: SRV                       # NODATA probe: "@ SRV"

fix:
  sourceDir: /lab/zones                 # read only, the tool NEVER writes here
  keyDir: /lab/keys
  workDir: /lab/build/dnssecretary
  deliver:                              # where the signed zone goes, per zone; the dir name is the service to restart
    default: /lab/auth1
    f2-tcp-edns.test: /lab/auth3
  parent:
    mode: lab                           # lab = write the DS and run sign-tld.sh; instructions = text for the registrar
    dsDir: /lab/build/parent-ds
    resignCommand: ["sh", "/lab/scripts/sign-tld.sh"]
    service: tld                        # restarted after resignCommand
